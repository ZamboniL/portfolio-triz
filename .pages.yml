# Pages CMS configuration: https://pagescms.org/docs/configuration/
# Edit the site at https://app.pagescms.org (sign in with GitHub).

media:
  input: public/images
  output: /images
  rename: safe
  categories: [image]

content:
  - name: projects
    label: Projetos
    type: collection
    path: src/content/projects
    format: yaml-frontmatter
    filename:
      # The file name becomes the page address, e.g. /projects/plotline
      template: "{title}.md"
      field: false
    view:
      fields: [title, year, order]
      primary: title
      sort: [order, title, year]
      default:
        sort: order
        order: asc
    fields:
      - name: title
        label: Nome do projeto
        type: string
        required: true
      - name: year
        label: Ano
        type: number
        required: true
        options:
          min: 2000
          max: 2100
      - name: order
        label: Posição na grade
        description: Números menores aparecem primeiro. A página inicial mostra os 6 primeiros projetos.
        type: number
        required: true
        options:
          min: 1
      - name: thumbnail
        label: Imagem de capa
        description: Aparece como um quadrado na página inicial e na de projetos. Imagens quadradas ficam melhores.
        type: image
      - name: thumbnailFocus
        label: Parte da capa que deve ficar visível
        description: Só faz diferença se a imagem de capa não for quadrada.
        type: select
        options:
          values:
            - name: center
              label: Centro
            - name: top
              label: Topo
            - name: bottom
              label: Base
            - name: left
              label: Esquerda
            - name: right
              label: Direita
      - name: accent
        label: Cor do título
        type: select
        options:
          values:
            - name: purple
              label: Roxo
            - name: blue
              label: Azul
            - name: red
              label: Vermelho
            - name: lime
              label: Verde-limão
      - name: intro
        label: Introdução
        description: O parágrafo curto logo abaixo do título.
        type: text
        required: true
      - name: screens
        label: Telas de celular
        description: Até 3 imagens, mostradas da esquerda para a direita no painel branco. Deixe vazio para esconder o painel.
        type: image
        options:
          multiple:
            max: 3
      - name: body
        label: Texto principal
        type: rich-text
        options:
          format: markdown
          media: false
          switcher: false

  - name: site
    label: Início e contato
    type: file
    path: src/content/site.json
    format: json
    fields:
      - name: tagline
        label: Frase da página inicial
        type: string
        required: true
      - name: projectsIntro
        label: Introdução da página de projetos
        type: text
        required: true
      - name: email
        label: Endereço de e-mail
        description: É copiado quando alguém clica em "e-mail" no rodapé.
        type: string
        required: true
      - name: substackUrl
        label: Link do Substack
        type: string
        required: true

  - name: about
    label: Página Sobre
    type: file
    path: src/content/about.json
    format: json
    fields:
      - name: bio
        label: Parágrafos da bio
        type: text
        list: true
        required: true
      - name: education
        label: Formação
        type: object
        list: true
        fields:
          - name: title
            label: Curso
            type: string
            required: true
          - name: years
            label: Anos
            description: ex. 2019-2021
            type: string
            required: true
      - name: skillRows
        label: Habilidades
        description: Cada linha é uma fileira de etiquetas de habilidades na página.
        type: object
        list:
          collapsible:
            summary: "Linha {index}"
        fields:
          - name: skills
            label: Habilidades nesta linha
            type: object
            list: true
            fields:
              - name: label
                label: Habilidade
                type: string
                required: true
              - name: color
                label: Cor ao passar o mouse
                type: select
                required: true
                options:
                  values:
                    - name: blue
                      label: Azul
                    - name: red
                      label: Vermelho
                    - name: lime
                      label: Verde-limão
                    - name: purple
                      label: Roxo
